name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    runs-on: macos-15   # Apple Silicon runner (macos-14 label was retired)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (clang_64 + WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        env:
          PONYMAIL_GOOGLE_CLIENT_ID: ${{ secrets.PONYMAIL_GOOGLE_CLIENT_ID }}
          PONYMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PONYMAIL_GOOGLE_CLIENT_SECRET }}
          PONYMAIL_MS_CLIENT_ID: ${{ secrets.PONYMAIL_MS_CLIENT_ID }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPONYMAIL_BUILD_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/ponymail_tests

      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/PonyMail.app -verbose=1 -always-overwrite
          # Ad-hoc sign so the bundle launches on Apple Silicon (unsigned arm64 binaries are refused outright).
          codesign --force --deep --sign - build/PonyMail.app
          codesign --verify --deep --strict build/PonyMail.app

      - name: Create DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="1.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          mkdir -p dist dmgroot
          cp -R build/PonyMail.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "PonyMail" -srcfolder dmgroot -ov -format UDZO "dist/PonyMail-${version}-macOS-arm64.dmg"
          ls -la dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PonyMail-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
